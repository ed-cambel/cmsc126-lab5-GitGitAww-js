<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Student Records</title>
    <link rel="stylesheet" type="text/css" href="lab5_styles.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Open Sans' rel='stylesheet'>

    <script src="lab5_scripts.js"></script>
</head>

<body class="home_page">
    <!-- Navigation Bar -->
    <nav class="nav_bar">
        <div class="nav_links">
            <img id="logo" src="images/logo.png">

            <a class="navigation" href="index.html">HOME</a>
            <a class="navigation" href="lab5_display.html">DISPLAY STUDENTS</a>
            <a class="navigation" href="lab5_about.html">ABOUT</a>
        </div>

        <div class="nav_search">
            <input type="text" id="search_id" placeholder="Enter Student ID"><br>
            <button class="search_button" type="button" onclick="find_student()">Search Student</button>
        </div>
    </nav>

    <main>
        <header class="page_header">
            <h1 id="title">STUDENT RECORD SYSTEM</h1>

            <!-- Date Button -->
            <button class="search_button" type="button" onclick="time_now()"> Show Current Date</button>
            <p id="date_output"></p>
        </header>

        <!--------------- ADD STUDENT SECTION --------------->
        <div class="add_student_forms">
            <h2>Add Student</h2>

            <!-- Student Information -->
            <form id="student_form">
                <!-- Textfields -->
                <label>NAME</label>
                <input type="text" id="student_id" placeholder="Enter name">

                <label>AGE</label>
                <input type="number" id="student_age" placeholder="Enter age">

                <label>EMAIL</label>
                <input type="text" id="student_email" placeholder="Enter email">

                <!-- Dropdown Menu -->
                <label>COURSE</label>
                <select id="course">
                    <option value="" selected disabled hidden>Select a course</option>

                    <option>BA Food Appreciation</option>
                    <option>BA Applied Poetry of the Future</option>
                    <option>BS Computer Repair Shop</option>
                    <option>BS Video Gaming</option>
                    <option>BS Installing and Downloading</option>
                </select>

                <!-- Submit Button -->
                <button type="button" onclick="add_student()">Submit</button>
            </form>
            <!-- Error Display -->
            <ul id="form_error"></ul>
        </div>
    </main>
    <script src="lab5_scripts.js"></script>
    <!--------------- FOOTER SECTION --------------->
    <footer class="footer">
        <hr>

        <p>© 2026 Student Records System [CMSC 126] | All Rights Reserved</p>
        <p>Developed by: Git Git Aww</p>
        <p>Members: E. Cambel, J. Espartero, J. Fallarme, M. Gelvezon</p>
    </footer>
</body>

</html>
