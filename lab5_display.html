<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Student Records</title>
    <link rel="stylesheet" type="text/css" href="lab5_styles.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
</head>

<body class="display_page">
    <nav class="nav_bar">
        <!-- Navigation Bar -->
        <div class="navBar">
            <div class="nav_links">
                <img id="logo" src="images/logo.png">
                <a class="navigation" href="index.html">HOME</a>
                <a class="navigation" href="lab5_display.html">DISPLAY STUDENTS</a>
                <a class="navigation" href="lab5_about.html">ABOUT</a>
            </div>
        </div>

        <!--------------- SHOW STUDENT SECTION --------------->
        <div class="nav_search">
            <input type="text" id="search_id" placeholder="Enter Student ID"><br>
            <button class="search_button" type="button" onclick="find_student()">Search Student</button>
        </div>
    </nav>


    <!--------------- DISPLAY STUDENT SECTION --------------->
    <main>
        <header class="page_header">
            <h2 id="title">Display Students</h2>
            <button type="button" class="display_button" onclick="display_student_list()">Display All Students</button>

            <div class = "table_container">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Student No.</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Course</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Student records will be dynamically inserted here -->
                        <tr>
                    <td colspan="5" style="text-align:center;">Click "Display All Students" to view records</td>
                </tr>
                    </tbody>
                </table>
            </div>

            <div id="displayOutput"></div>

        </header>
    </main>

    <script src="lab5_scripts.js"></script>

    <!--------------- FOOTER SECTION --------------->
<footer class="footer">
    <hr>
    <p>© 2026 Student Records System [CMSC 126] | All Rights Reserved</p>
    <p>Developed by: Git Git Aww</p>
    <p>Members: E. Cambel, J. Espartero, J. Fallarme, M. Gelvezon</p>
</footer>
    <script src="lab5_scripts.js"></script>
</body>
</html>
